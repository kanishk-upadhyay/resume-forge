[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-forge"
version = "1.0.0"
description = "In-House LaTeX Resume Parser, Studio & Single-Page PDF Compiler"
readme = "README.md"
authors = [
  { name = "Kanishk Upadhyay", email = "kanishkupadhyay22@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["resume", "latex", "pdf", "ats", "parser", "json-resume"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Text Processing :: Markup :: LaTeX"
]

[project.scripts]
resume-forge = "resume_forge.cli:main"
