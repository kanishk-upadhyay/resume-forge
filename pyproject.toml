[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-forge"
version = "1.0.0"
description = "In-House LaTeX Resume Parser, Studio & Single-Page PDF Compiler"
readme = "README.md"
authors = [
  { name = "Kanishk Upadhyay", email = "kanishkupadhyay22@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "scikit-learn>=1.3.0",
  "yake>=0.4.8"
]
keywords = ["resume", "latex", "pdf", "ats", "parser", "json-resume"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Text Processing :: Markup :: LaTeX"
]

[project.urls]
Homepage = "https://github.com/kanishkupadhyay/resume-forge"
Repository = "https://github.com/kanishkupadhyay/resume-forge"
Issues = "https://github.com/kanishkupadhyay/resume-forge/issues"

[project.scripts]
resume-forge = "resume_forge.cli:main"

[project.entry-points."resume_forge.providers"]
greenhouse = "resume_forge.providers.greenhouse:GreenhouseProvider"
lever = "resume_forge.providers.lever:LeverProvider"
smartrecruiters = "resume_forge.providers.smartrecruiters:SmartRecruitersProvider"
ashby = "resume_forge.providers.ashby:AshbyProvider"
workday = "resume_forge.providers.workday:WorkdayProvider"
aikyam = "resume_forge.providers.aikyam:AikyamProvider"
hackernews = "resume_forge.providers.hackernews:HNHiringProvider"
amazon = "resume_forge.providers.amazon:AmazonProvider"
rss = "resume_forge.providers.rss:RSSFeedProvider"

[tool.setuptools.packages.find]
where = ["."]
include = ["resume_forge*"]

[tool.setuptools.package-data]
resume_forge = ["templates/*", "web/static/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E501"]
