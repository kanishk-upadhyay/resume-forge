name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Verify CLI Parser
        run: |
          ./bin/resume-forge parse examples/kanishk_cern_fullstack_resume.tex -o examples/test_resume.json

      - name: Verify ATS Audit
        run: |
          ./bin/resume-forge audit examples/kanishk_cern_fullstack_resume.tex
