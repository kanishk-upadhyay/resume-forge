name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Verify CLI Parser
        run: |
          ./bin/resume-forge parse examples/kanishk_cern_fullstack_resume.tex -o examples/test_resume.json

      - name: Verify ATS Audit
        run: |
          ./bin/resume-forge audit examples/kanishk_cern_fullstack_resume.tex
