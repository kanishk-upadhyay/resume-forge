name: Build & Release PDF Resumes

on:
  push:
    branches: [ main ]
    paths:
      - '**.tex'
      - '**.json'
      - 'resume_forge/**'
      - 'variants/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile All Resume Variants to Single-Page PDFs
        run: |
          mkdir -p output/compiled_resumes
          # Compile canonical example
          ./bin/resume-forge compile examples/kanishk_cern_fullstack_resume.tex -o output/compiled_resumes/kanishk_cern_fullstack_resume.pdf

          # Compile all company-tailored variants in variants/
          for var_tex in variants/*.tex; do
            if [ -f "$var_tex" ]; then
              base=$(basename "$var_tex" .tex)
              echo "Compiling variant: $base"
              ./bin/resume-forge compile "$var_tex" -o "output/compiled_resumes/kanishk_${base}.pdf"
            fi
          done

          # Compile all 7 canonical presentation templates
          for tmpl in cern harvard jakes minimalist quant awesome academic; do
            echo "Compiling template: $tmpl"
            ./bin/resume-forge compile examples/kanishk_cern_fullstack_resume.tex -t "$tmpl" -o "output/compiled_resumes/kanishk_template_${tmpl}.pdf"
          done

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compiled-resumes
          path: output/compiled_resumes/*.pdf
